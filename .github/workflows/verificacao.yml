name: verificação

# Decisão de 03/11/2026: push direto na main, sem pull request. A barreira é a verificação local
# completa e o checkpoint; este workflow confere de novo, depois do push (ver docs/decisoes.md).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Em pull request, o grupo é o ramo e a execução nova substitui a anterior. Na main cada execução
  # tem o seu grupo (o run_id): nenhuma espera na fila nem cancela a outra (11/11/2026).
  group: verificacao-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Quais arquivos mudaram? Só docs/**, supabase/**, importacao/** e *.md: o e2e é pulado.
  mudancas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pula_e2e: ${{ steps.mudancas.outputs.pula_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico inteiro: o push compara o commit anterior da main (github.event.before).
          fetch-depth: 0
      - id: mudancas
        # Só docs/**, supabase/** e *.md mudaram? Então o build, o navegador e o e2e (que só eles usam)
        # são pulados; lint, tipos e testes unitários rodam sempre. Sem arquivos mudados, ou sem como
        # saber (antes zerado ou fora do histórico), roda tudo.
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
        run: |
          if [ "$EVENTO" = "push" ]; then
            if [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
              arquivos=""
            else
              arquivos="$(git diff --name-only "$ANTES" "$DEPOIS" || true)"
            fi
          else
            arquivos="$(git diff --name-only HEAD^1 HEAD 2>/dev/null || true)"
          fi
          echo "pula_e2e=$(printf '%s\n' "$arquivos" | bash scripts/ci/pula-e2e.sh)" >> "$GITHUB_OUTPUT"
          echo "Arquivos mudados:"
          echo "$arquivos"
      - if: steps.mudancas.outputs.pula_e2e == 'true'
        run: |
          echo "Só docs/, supabase/ ou *.md mudaram. Build e e2e pulados; lint, tipos e testes unitários rodam no job app." >> "$GITHUB_STEP_SUMMARY"

  # Lint, tipos e testes unitários: rodam sempre. O e2e tem job próprio (abaixo), em paralelo.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # O e2e em 4 shards, em paralelo. Antes (um job só) passava de 20 min (ver docs/decisoes.md). Desde a
  # 3.8 cada shard sobe o Supabase local (o login dos e2e).
  e2e:
    needs: mudancas
    if: needs.mudancas.outputs.pula_e2e != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O login (fatia 3.8): o build e os e2e precisam do Supabase local. Só o endereço e a chave
      # publicável (do Supabase local, sem segredo) vão para o app; a chave secreta fica no preparo dos
      # e2e (e2e/apoio/usuarios-de-teste.ts), lida do `supabase status`.
      - run: |
          # Hipótese (09/11/2026): a porta 54322 ocupada por uma conexão de saída (faixa efêmera do Linux,
          # 32768-60999) durante o download das imagens. Reserva 54320-54329 fora dessa faixa, mantendo as
          # reservas que o runner já tiver, e registra quem usa essas portas enquanto o Supabase sobe.
          reservadas="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          sudo sysctl -qw net.ipv4.ip_local_reserved_ports="${reservadas:+$reservadas,}54320-54329"
          echo "portas reservadas: $(sysctl -n net.ipv4.ip_local_reserved_ports)"
          (while sleep 0.2; do
            s="$(sudo ss -tanpH '( sport >= :54320 and sport <= :54329 )' 2>/dev/null || true)"
            [ -n "$s" ] && printf '%s\n%s\n' "$(date +%T.%N)" "$s"
          done) > "$RUNNER_TEMP/portas-supabase.log" 2>&1 &
          amostrador=$!
          if pnpm exec supabase start; then status=0; else status=$?; fi
          kill "$amostrador" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            echo "::group::Portas 54320-54329 durante o supabase start"
            cat "$RUNNER_TEMP/portas-supabase.log"
            echo "::endgroup::"
            echo "::group::Portas 54320-54329 agora e contêineres"
            sudo ss -tanp '( sport >= :54320 and sport <= :54329 )' || true
            docker ps -a --format '{{.Names}} {{.Status}} {{.Ports}}' || true
            echo "::endgroup::"
          fi
          exit "$status"
      - run: |
          pnpm exec supabase status -o env \
            | sed -nE 's/^API_URL="?([^"]*)"?$/NEXT_PUBLIC_SUPABASE_URL=\1/p; s/^PUBLISHABLE_KEY="?([^"]*)"?$/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\1/p' \
            >> "$GITHUB_ENV"
      - id: build
        run: pnpm build
      - id: playwright
        run: echo "versao=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: bash scripts/ci/instalar-chromium.sh
      # Quatro fatias em paralelo (cada uma com o seu Supabase e o seu build). Os projetos de dependência
      # (o "preparar", que faz o login) entram em TODO shard: o Playwright os reinclui depois de dividir.
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/4 --reporter=github,blob
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  # Junta os relatórios dos shards e decide o resultado do e2e. Este é o job a exigir no lugar do e2e
  # que ficava dentro do app (a regra de proteção da main só vale com o GitHub Team).
  e2e-resultado:
    needs: [mudancas, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - if: needs.e2e.result != 'skipped'
        uses: actions/checkout@v4
      - if: needs.e2e.result != 'skipped'
        uses: pnpm/action-setup@v4
      - if: needs.e2e.result != 'skipped'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: needs.e2e.result != 'skipped'
        run: pnpm install --frozen-lockfile
      - if: needs.e2e.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - if: needs.e2e.result != 'skipped'
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - if: needs.e2e.result != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - if: always()
        run: |
          # Passa se o e2e passou, ou se foi pulado porque só docs, supabase, importacao ou .md mudaram.
          # Falhar, cancelar ou não rodar quando devia reprova.
          if [ "${{ needs.mudancas.outputs.pula_e2e }}" = "true" ] && [ "${{ needs.e2e.result }}" = "skipped" ]; then
            echo "e2e pulado: só docs, supabase, importacao ou .md mudaram."
            exit 0
          fi
          if [ "${{ needs.e2e.result }}" = "success" ]; then
            exit 0
          fi
          echo "O e2e terminou como: ${{ needs.e2e.result }}"
          exit 1

  banco:
    # Só Docker no runner: sem token, sem link e sem segredo (ver docs/decisoes.md).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          # Hipótese (09/11/2026): a porta 54322 ocupada por uma conexão de saída (faixa efêmera do Linux,
          # 32768-60999) durante o download das imagens. Reserva 54320-54329 fora dessa faixa, mantendo as
          # reservas que o runner já tiver, e registra quem usa essas portas enquanto o Supabase sobe.
          reservadas="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          sudo sysctl -qw net.ipv4.ip_local_reserved_ports="${reservadas:+$reservadas,}54320-54329"
          echo "portas reservadas: $(sysctl -n net.ipv4.ip_local_reserved_ports)"
          (while sleep 0.2; do
            s="$(sudo ss -tanpH '( sport >= :54320 and sport <= :54329 )' 2>/dev/null || true)"
            [ -n "$s" ] && printf '%s\n%s\n' "$(date +%T.%N)" "$s"
          done) > "$RUNNER_TEMP/portas-supabase.log" 2>&1 &
          amostrador=$!
          if pnpm exec supabase start; then status=0; else status=$?; fi
          kill "$amostrador" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            echo "::group::Portas 54320-54329 durante o supabase start"
            cat "$RUNNER_TEMP/portas-supabase.log"
            echo "::endgroup::"
            echo "::group::Portas 54320-54329 agora e contêineres"
            sudo ss -tanp '( sport >= :54320 and sport <= :54329 )' || true
            docker ps -a --format '{{.Names}} {{.Status}} {{.Ports}}' || true
            echo "::endgroup::"
          fi
          exit "$status"
      - run: pnpm exec supabase db lint --fail-on warning
      - run: pnpm exec supabase test db
      - run: pnpm run db:tipos
      - run: git diff --exit-code -- lib/dados/tipos-do-banco.ts
      # Com a máquina sem memória livre, os tipos não se geram localmente: quando divergem, o arquivo
      # gerado sobe como artefato para entrar no commit seguinte (ver docs/decisoes.md, 04/11/2026).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tipos-do-banco
          path: lib/dados/tipos-do-banco.ts
          retention-days: 7

  # Os jobs abaixo rodam só no pull request e NÃO são verificação obrigatória (o ruleset exige só app e
  # banco). Decisão de 04/11/2026 (aprovação da 3.8 e fatia 3.9a, ver docs/decisoes.md).
  capturas:
    # As capturas das telas (acesso, tela inicial logada e a barra com o Sair), claro e escuro, em
    # 1366, 1920, tablet 820 e celular 390: o visual é conferido pelo artefato, sem rodar nada na
    # máquina local. Paralelo ao app.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          # Hipótese (09/11/2026): a porta 54322 ocupada por uma conexão de saída (faixa efêmera do Linux,
          # 32768-60999) durante o download das imagens. Reserva 54320-54329 fora dessa faixa, mantendo as
          # reservas que o runner já tiver, e registra quem usa essas portas enquanto o Supabase sobe.
          reservadas="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          sudo sysctl -qw net.ipv4.ip_local_reserved_ports="${reservadas:+$reservadas,}54320-54329"
          echo "portas reservadas: $(sysctl -n net.ipv4.ip_local_reserved_ports)"
          (while sleep 0.2; do
            s="$(sudo ss -tanpH '( sport >= :54320 and sport <= :54329 )' 2>/dev/null || true)"
            [ -n "$s" ] && printf '%s\n%s\n' "$(date +%T.%N)" "$s"
          done) > "$RUNNER_TEMP/portas-supabase.log" 2>&1 &
          amostrador=$!
          if pnpm exec supabase start; then status=0; else status=$?; fi
          kill "$amostrador" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            echo "::group::Portas 54320-54329 durante o supabase start"
            cat "$RUNNER_TEMP/portas-supabase.log"
            echo "::endgroup::"
            echo "::group::Portas 54320-54329 agora e contêineres"
            sudo ss -tanp '( sport >= :54320 and sport <= :54329 )' || true
            docker ps -a --format '{{.Names}} {{.Status}} {{.Ports}}' || true
            echo "::endgroup::"
          fi
          exit "$status"
      - run: |
          pnpm exec supabase status -o env \
            | sed -nE 's/^API_URL="?([^"]*)"?$/NEXT_PUBLIC_SUPABASE_URL=\1/p; s/^PUBLISHABLE_KEY="?([^"]*)"?$/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\1/p' \
            >> "$GITHUB_ENV"
      - run: pnpm build
      - id: playwright
        run: echo "versao=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: bash scripts/ci/instalar-chromium.sh
      - env:
          EIXO_CAPTURAS: "1"
        run: pnpm test:capturas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-do-acesso
          path: capturas/
          retention-days: 7
          if-no-files-found: warn

  modo-banco:
    # Os ~200 ativos de desenvolvimento, o e2e pequeno do modo banco (as mutações do SQL rodam na rodada noturna; a medição
    # tem job próprio, o medicao). Sem pull request (commits direto na main, 05/11/2026), roda também
    # no push da main; não é verificação obrigatória (as obrigatórias continuam app e banco).
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          # Hipótese (09/11/2026): a porta 54322 ocupada por uma conexão de saída (faixa efêmera do Linux,
          # 32768-60999) durante o download das imagens. Reserva 54320-54329 fora dessa faixa, mantendo as
          # reservas que o runner já tiver, e registra quem usa essas portas enquanto o Supabase sobe.
          reservadas="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          sudo sysctl -qw net.ipv4.ip_local_reserved_ports="${reservadas:+$reservadas,}54320-54329"
          echo "portas reservadas: $(sysctl -n net.ipv4.ip_local_reserved_ports)"
          (while sleep 0.2; do
            s="$(sudo ss -tanpH '( sport >= :54320 and sport <= :54329 )' 2>/dev/null || true)"
            [ -n "$s" ] && printf '%s\n%s\n' "$(date +%T.%N)" "$s"
          done) > "$RUNNER_TEMP/portas-supabase.log" 2>&1 &
          amostrador=$!
          if pnpm exec supabase start; then status=0; else status=$?; fi
          kill "$amostrador" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            echo "::group::Portas 54320-54329 durante o supabase start"
            cat "$RUNNER_TEMP/portas-supabase.log"
            echo "::endgroup::"
            echo "::group::Portas 54320-54329 agora e contêineres"
            sudo ss -tanp '( sport >= :54320 and sport <= :54329 )' || true
            docker ps -a --format '{{.Names}} {{.Status}} {{.Ports}}' || true
            echo "::endgroup::"
          fi
          exit "$status"
      - run: pnpm db:dev-dados
      # Todas as funções que o app chama existem no banco com a mesma assinatura (só leitura, só nomes).
      - run: pnpm db:paridade
      - run: |
          pnpm exec supabase status -o env \
            | sed -nE 's/^API_URL="?([^"]*)"?$/NEXT_PUBLIC_SUPABASE_URL=\1/p; s/^PUBLISHABLE_KEY="?([^"]*)"?$/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\1/p' \
            >> "$GITHUB_ENV"
      - run: pnpm build
      - id: playwright
        run: echo "versao=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: bash scripts/ci/instalar-chromium.sh
      - run: pnpm test:e2e-banco
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-banco
          path: playwright-report/
          retention-days: 7
      # As mutações nos guardas do SQL saíram deste job (12/11/2026): rodam na rodada noturna (e2e-noturno.yml)
      # e antes da carga na nuvem (docs/decisoes.md). O pgTAP e o e2e seguem a cada push.
  medicao:
    # O diagnóstico da lista de placas num job curto (sem build nem navegador): 201, 1.000 e 5.000
    # ativos, com o banco recriado entre eles; sem limite de tempo nas consultas medidas. O relatório
    # sobe sempre, mesmo parcial (decisão de 05/11/2026, fatia 3.9a).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          # Hipótese (09/11/2026): a porta 54322 ocupada por uma conexão de saída (faixa efêmera do Linux,
          # 32768-60999) durante o download das imagens. Reserva 54320-54329 fora dessa faixa, mantendo as
          # reservas que o runner já tiver, e registra quem usa essas portas enquanto o Supabase sobe.
          reservadas="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          sudo sysctl -qw net.ipv4.ip_local_reserved_ports="${reservadas:+$reservadas,}54320-54329"
          echo "portas reservadas: $(sysctl -n net.ipv4.ip_local_reserved_ports)"
          (while sleep 0.2; do
            s="$(sudo ss -tanpH '( sport >= :54320 and sport <= :54329 )' 2>/dev/null || true)"
            [ -n "$s" ] && printf '%s\n%s\n' "$(date +%T.%N)" "$s"
          done) > "$RUNNER_TEMP/portas-supabase.log" 2>&1 &
          amostrador=$!
          if pnpm exec supabase start; then status=0; else status=$?; fi
          kill "$amostrador" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            echo "::group::Portas 54320-54329 durante o supabase start"
            cat "$RUNNER_TEMP/portas-supabase.log"
            echo "::endgroup::"
            echo "::group::Portas 54320-54329 agora e contêineres"
            sudo ss -tanp '( sport >= :54320 and sport <= :54329 )' || true
            docker ps -a --format '{{.Names}} {{.Status}} {{.Ports}}' || true
            echo "::endgroup::"
          fi
          exit "$status"
      - run: |
          for n in 201 1000 5000; do
            pnpm exec supabase db reset > /dev/null 2>&1
            node scripts/db-dev-dados.ts --quantidade "$n"
            node scripts/db-diagnostico.ts --rotulo "$n" --saida diagnostico-da-lista.md > /dev/null
          done
      # A carga em lote: 2.000 ativos numa transação, com e sem os gatilhos da leitura mantida.
      - run: |
          echo "" >> diagnostico-da-lista.md
          echo "## Carga em lote (2.000 ativos numa transação)" >> diagnostico-da-lista.md
          for modo in "" "--sem-gatilhos"; do
            pnpm exec supabase db reset > /dev/null 2>&1
            node scripts/db-dev-dados.ts --quantidade 2000 $modo | grep "Dados de desenvolvimento" >> diagnostico-da-lista.md
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-da-lista
          path: diagnostico-da-lista.md
          retention-days: 7
          if-no-files-found: warn
