name: verificação

# Decisão de 03/11/2026: push direto na main, sem pull request. A barreira é a verificação local
# completa e o checkpoint; este workflow confere de novo, depois do push (ver docs/decisoes.md).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verificacao-${{ github.ref }}
  # Em pull request, a execução nova substitui a anterior; na main, cada push termina a sua.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    runs-on: ubuntu-latest
    # A suíte de tela (1002 testes, 1 worker no CI) passou de 20 min: ver docs/decisoes.md. Desde a 3.8
    # o job também sobe o Supabase local (o login dos e2e).
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico inteiro: o push compara o commit anterior da main (github.event.before).
          fetch-depth: 0
      - id: mudancas
        # Só docs/**, supabase/** e *.md mudaram? Então o build, o navegador e o e2e (que só eles usam)
        # são pulados; lint, tipos e testes unitários rodam sempre. Sem arquivos mudados, ou sem como
        # saber (antes zerado ou fora do histórico), roda tudo.
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
        run: |
          if [ "$EVENTO" = "push" ]; then
            if [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
              arquivos=""
            else
              arquivos="$(git diff --name-only "$ANTES" "$DEPOIS" || true)"
            fi
          else
            arquivos="$(git diff --name-only HEAD^1 HEAD 2>/dev/null || true)"
          fi
          echo "pula_e2e=$(printf '%s\n' "$arquivos" | bash scripts/ci/pula-e2e.sh)" >> "$GITHUB_OUTPUT"
          echo "Arquivos mudados:"
          echo "$arquivos"
      - if: steps.mudancas.outputs.pula_e2e == 'true'
        run: |
          echo "Só docs/, supabase/ ou *.md mudaram. Build e e2e pulados; lint, tipos e testes unitários rodaram." >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # O login (fatia 3.8): o build e os e2e precisam do Supabase local. Só o endereço e a chave
      # publicável (do Supabase local, sem segredo) vão para o app; a chave secreta fica no preparo dos
      # e2e (e2e/apoio/usuarios-de-teste.ts), lida do `supabase status`.
      - if: steps.mudancas.outputs.pula_e2e != 'true'
        run: pnpm exec supabase start
      - if: steps.mudancas.outputs.pula_e2e != 'true'
        run: |
          pnpm exec supabase status -o env \
            | sed -nE 's/^API_URL="?([^"]*)"?$/NEXT_PUBLIC_SUPABASE_URL=\1/p; s/^PUBLISHABLE_KEY="?([^"]*)"?$/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\1/p' \
            >> "$GITHUB_ENV"
      - id: build
        if: steps.mudancas.outputs.pula_e2e != 'true'
        run: pnpm build
      - id: playwright
        if: steps.mudancas.outputs.pula_e2e != 'true'
        run: echo "versao=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.mudancas.outputs.pula_e2e != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.mudancas.outputs.pula_e2e != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.mudancas.outputs.pula_e2e != 'true'
        run: pnpm test:e2e
      # As capturas das telas de acesso (1366, 1920, tablet 820 e celular 390, claro e escuro), só no
      # pull request, mesmo se o e2e falhar: o visual é conferido pelo artefato, sem rodar nada na
      # máquina local (decisão de 04/11/2026, ver docs/decisoes.md).
      - id: capturas
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.build.outcome == 'success' }}
        env:
          EIXO_CAPTURAS: "1"
        run: pnpm test:capturas
      - uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name == 'pull_request' }}
        with:
          name: capturas-do-acesso
          path: capturas/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  banco:
    # Só Docker no runner: sem token, sem link e sem segredo (ver docs/decisoes.md).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start
      - run: pnpm exec supabase db lint --fail-on warning
      - run: pnpm exec supabase test db
      - run: pnpm run db:tipos
      - run: git diff --exit-code -- lib/dados/tipos-do-banco.ts
