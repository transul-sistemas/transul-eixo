name: verificação

# Decisão de 03/11/2026: push direto na main, sem pull request. A barreira é a verificação local
# completa e o checkpoint; este workflow confere de novo, depois do push (ver docs/decisoes.md).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verificacao-${{ github.ref }}
  # Em pull request, a execução nova substitui a anterior; na main, cada push termina a sua.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    runs-on: ubuntu-latest
    # A suíte de tela (1002 testes, 1 worker no CI) passou de 20 min: ver docs/decisoes.md. Desde a 3.8
    # o job também sobe o Supabase local (o login dos e2e). O CI do PR #31 levou 52 min: o prazo subiu
    # para 70 como rede de segurança (aprovação da 3.8, 03/11/2026).
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico inteiro: o push compara o commit anterior da main (github.event.before).
          fetch-depth: 0
      - id: mudancas
        # Só docs/**, supabase/** e *.md mudaram? Então o build, o navegador e o e2e (que só eles usam)
        # são pulados; lint, tipos e testes unitários rodam sempre. Sem arquivos mudados, ou sem como
        # saber (antes zerado ou fora do histórico), roda tudo.
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
        run: |
          if [ "$EVENTO" = "push" ]; then
            if [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
              arquivos=""
            else
              arquivos="$(git diff --name-only "$ANTES" "$DEPOIS" || true)"
            fi
          else
            arquivos="$(git diff --name-only HEAD^1 HEAD 2>/dev/null || true)"
          fi
          echo "pula_e2e=$(printf '%s\n' "$arquivos" | bash scripts/ci/pula-e2e.sh)" >> "$GITHUB_OUTPUT"
          echo "Arquivos mudados:"
          echo "$arquivos"
      - if: steps.mudancas.outputs.pula_e2e == 'true'
        run: |
          echo "Só docs/, supabase/ ou *.md mudaram. Build e e2e pulados; lint, tipos e testes unitários rodaram." >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # O login (fatia 3.8): o build e os e2e precisam do Supabase local. Só o endereço e a chave
      # publicável (do Supabase local, sem segredo) vão para o app; a chave secreta fica no preparo dos
      # e2e (e2e/apoio/usuarios-de-teste.ts), lida do `supabase status`.
      - if: steps.mudancas.outputs.pula_e2e != 'true'
        run: pnpm exec supabase start
      - if: steps.mudancas.outputs.pula_e2e != 'true'
        run: |
          pnpm exec supabase status -o env \
            | sed -nE 's/^API_URL="?([^"]*)"?$/NEXT_PUBLIC_SUPABASE_URL=\1/p; s/^PUBLISHABLE_KEY="?([^"]*)"?$/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\1/p' \
            >> "$GITHUB_ENV"
      - id: build
        if: steps.mudancas.outputs.pula_e2e != 'true'
        run: pnpm build
      - id: playwright
        if: steps.mudancas.outputs.pula_e2e != 'true'
        run: echo "versao=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.mudancas.outputs.pula_e2e != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.mudancas.outputs.pula_e2e != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.mudancas.outputs.pula_e2e != 'true'
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  banco:
    # Só Docker no runner: sem token, sem link e sem segredo (ver docs/decisoes.md).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start
      - run: pnpm exec supabase db lint --fail-on warning
      - run: pnpm exec supabase test db
      - run: pnpm run db:tipos
      - run: git diff --exit-code -- lib/dados/tipos-do-banco.ts
      # Com a máquina sem memória livre, os tipos não se geram localmente: quando divergem, o arquivo
      # gerado sobe como artefato para entrar no commit seguinte (ver docs/decisoes.md, 03/11/2026).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tipos-do-banco
          path: lib/dados/tipos-do-banco.ts
          retention-days: 7

  # Os jobs abaixo rodam só no pull request e NÃO são verificação obrigatória (o ruleset exige só app e
  # banco). Decisão de 03/11/2026 (aprovação da 3.8 e fatia 3.9a, ver docs/decisoes.md).
  capturas:
    # As capturas das telas (acesso, tela inicial logada e a barra com o Sair), claro e escuro, em
    # 1366, 1920, tablet 820 e celular 390: o visual é conferido pelo artefato, sem rodar nada na
    # máquina local. Paralelo ao app.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start
      - run: |
          pnpm exec supabase status -o env \
            | sed -nE 's/^API_URL="?([^"]*)"?$/NEXT_PUBLIC_SUPABASE_URL=\1/p; s/^PUBLISHABLE_KEY="?([^"]*)"?$/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\1/p' \
            >> "$GITHUB_ENV"
      - run: pnpm build
      - id: playwright
        run: echo "versao=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - env:
          EIXO_CAPTURAS: "1"
        run: pnpm test:capturas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-do-acesso
          path: capturas/
          retention-days: 7
          if-no-files-found: warn

  modo-banco:
    # A carga de 5.000 ativos com a medição da lista (tempos e planos no resumo e no artefato), depois o
    # banco limpo com os ~200 ativos de desenvolvimento e o e2e pequeno do modo banco.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start
      - run: pnpm db:carga
      - if: always()
        run: if [ -f medicao-da-lista.md ]; then cat medicao-da-lista.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medicao-da-lista
          path: medicao-da-lista.md
          retention-days: 7
          if-no-files-found: warn
      - run: pnpm exec supabase db reset
      - run: pnpm db:dev-dados
      - run: |
          pnpm exec supabase status -o env \
            | sed -nE 's/^API_URL="?([^"]*)"?$/NEXT_PUBLIC_SUPABASE_URL=\1/p; s/^PUBLISHABLE_KEY="?([^"]*)"?$/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\1/p' \
            >> "$GITHUB_ENV"
      - run: pnpm build
      - id: playwright
        run: echo "versao=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e-banco
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-banco
          path: playwright-report/
          retention-days: 7
