name: e2e noturno

# O e2e completo da main, uma vez por noite (6h UTC, 3h em São Paulo), só se houve commit nas últimas
# 24 horas; o disparo manual sempre roda. A falha chega por e-mail do GitHub (ver docs/decisoes.md).
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-noturno
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: recente
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            echo "roda=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git log --since="24 hours ago" --oneline HEAD)" ]; then
            echo "roda=true" >> "$GITHUB_OUTPUT"
          else
            echo "roda=false" >> "$GITHUB_OUTPUT"
            echo "Sem commit na main nas últimas 24 horas: e2e noturno não rodou." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.recente.outputs.roda == 'true'
      - uses: actions/setup-node@v4
        if: steps.recente.outputs.roda == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.recente.outputs.roda == 'true'
        run: pnpm install --frozen-lockfile
      # O e2e precisa do Supabase local (login e usuários de teste, desde a 3.8): sobe antes do
      # `supabase status`, que o preparo do Playwright lê por dentro (nunca impresso).
      - if: steps.recente.outputs.roda == 'true'
        run: |
          # Hipótese (09/11/2026): a porta 54322 ocupada por uma conexão de saída (faixa efêmera do Linux,
          # 32768-60999) durante o download das imagens. Reserva 54320-54329 fora dessa faixa, mantendo as
          # reservas que o runner já tiver, e registra quem usa essas portas enquanto o Supabase sobe.
          reservadas="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          sudo sysctl -qw net.ipv4.ip_local_reserved_ports="${reservadas:+$reservadas,}54320-54329"
          echo "portas reservadas: $(sysctl -n net.ipv4.ip_local_reserved_ports)"
          (while sleep 0.2; do
            s="$(sudo ss -tanpH '( sport >= :54320 and sport <= :54329 )' 2>/dev/null || true)"
            [ -n "$s" ] && printf '%s\n%s\n' "$(date +%T.%N)" "$s"
          done) > "$RUNNER_TEMP/portas-supabase.log" 2>&1 &
          amostrador=$!
          if pnpm exec supabase start; then status=0; else status=$?; fi
          kill "$amostrador" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            echo "::group::Portas 54320-54329 durante o supabase start"
            cat "$RUNNER_TEMP/portas-supabase.log"
            echo "::endgroup::"
            echo "::group::Portas 54320-54329 agora e contêineres"
            sudo ss -tanp '( sport >= :54320 and sport <= :54329 )' || true
            docker ps -a --format '{{.Names}} {{.Status}} {{.Ports}}' || true
            echo "::endgroup::"
          fi
          exit "$status"
      - if: steps.recente.outputs.roda == 'true'
        run: |
          pnpm exec supabase status -o env \
            | sed -nE 's/^API_URL="?([^"]*)"?$/NEXT_PUBLIC_SUPABASE_URL=\1/p; s/^PUBLISHABLE_KEY="?([^"]*)"?$/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\1/p' \
            >> "$GITHUB_ENV"
      - if: steps.recente.outputs.roda == 'true'
        run: pnpm build
      - if: steps.recente.outputs.roda == 'true'
        run: bash scripts/ci/instalar-chromium.sh
      - if: steps.recente.outputs.roda == 'true'
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-noturno
          path: playwright-report/
          retention-days: 7

  mutacoes-sql:
    # As mutações nos guardas do SQL (cada uma tem de derrubar o pgTAP), tiradas do modo-banco a cada push em
    # 12/11/2026: rodam toda noite e DEVEM estar verdes antes da carga na nuvem (docs/decisoes.md).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start
      - run: node scripts/ci/mutacoes-sql.mjs
